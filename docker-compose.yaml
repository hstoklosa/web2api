services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: web2api
      POSTGRES_USER: web2api
      POSTGRES_PASSWORD: web2api
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2api -d web2api"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
